name: book builds

on:
  push:
    branches: [main]
    paths:
      - "characters/laynlindr-freth/backstory/book/**"
      - "labs/audiobook/tools/render_audiobook.py"
      - ".github/workflows/audiobook.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Render even unchanged chapters"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  list-chapters:
    runs-on: ubuntu-latest
    outputs:
      chapters: ${{ steps.set.outputs.chapters }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          echo "chapters=$(ls characters/laynlindr-freth/backstory/book/chapter-*.md \
            | xargs -n1 basename | grep -v '^chapter-00' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  audio:
    needs: list-chapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJSON(needs.list-chapters.outputs.chapters) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          BASE="${{ github.event.before }}"
          if [ -n "$BASE" ]; then
            n=$(git diff --name-only --diff-filter=ACM "$BASE" \
              -- "characters/laynlindr-freth/backstory/book/${{ matrix.chapter }}" | wc -l)
          else
            n=0
          fi
          if [ "${{ inputs.force }}" = "true" ] || [ "$n" -gt 0 ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "chapter unchanged, nothing to do"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.render == 'true'
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        if: steps.check.outputs.render == 'true'
        with:
          path: labs/audiobook/cache
          key: frag-${{ matrix.chapter }}-${{ hashFiles(format('characters/laynlindr-freth/backstory/book/{0}', matrix.chapter)) }}
          restore-keys: frag-${{ matrix.chapter }}-
      - name: Render chapter
        if: steps.check.outputs.render == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile kokoro
          python3 labs/audiobook/tools/render_audiobook.py \
            "characters/laynlindr-freth/backstory/book/${{ matrix.chapter }}" --force --jobs 1
      - id: slug
        if: steps.check.outputs.render == 'true'
        env:
          CH: ${{ matrix.chapter }}
        run: echo "name=audio-${CH%.md}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.render == 'true'
        with:
          name: ${{ steps.slug.outputs.name }}
          path: characters/laynlindr-freth/backstory/audiobook/*.mp3
          if-no-files-found: error

  docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-docx && python3 characters/laynlindr-freth/backstory/book/make_docx.py
      - uses: actions/upload-artifact@v4
        with:
          name: docx
          path: characters/laynlindr-freth/backstory/book/Soulknife.docx
          if-no-files-found: error

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q libreoffice-writer
      - run: pip install python-docx && python3 characters/laynlindr-freth/backstory/book/make_docx.py
      - run: soffice --headless -env:UserInstallation=file:///tmp/lo --convert-to pdf --outdir characters/laynlindr-freth/backstory/book characters/laynlindr-freth/backstory/book/Soulknife.docx && test -f characters/laynlindr-freth/backstory/book/Soulknife.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: characters/laynlindr-freth/backstory/book/Soulknife.pdf
          if-no-files-found: error

  release:
    needs: [audio, docx, pdf]
    if: ${{ !cancelled() && needs.audio.result == 'success' && needs.docx.result == 'success' && needs.pdf.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          if compgen -G "/tmp/assets/*.mp3" >/dev/null; then
            zip -j /tmp/assets/soulknife-audiobook.zip /tmp/assets/*.mp3
            rm /tmp/assets/*.mp3
          fi
          files=(/tmp/assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to upload"
            exit 0
          fi
          gh release view book-builds >/dev/null 2>&1 || \
            gh release create book-builds --title "Soulknife builds" --notes "Automated builds: audio (kokoro), docx, pdf."
          gh release upload book-builds "${files[@]}" --clobber
          gh release view book-builds --json assets --jq '.assets[].name'