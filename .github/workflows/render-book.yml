name: Render book

on:
  push:
    branches: [main]
    paths:
      - 'characters/laynlindr-freth/backstory/book/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-book
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-docx
        run: pip install python-docx

      - name: Build DOCX
        working-directory: characters/laynlindr-freth/backstory/book
        run: python make_docx.py

      - name: Install LibreOffice and Garamond
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-ebgaramond

      - name: Render PDF
        working-directory: characters/laynlindr-freth/backstory/book
        run: soffice --headless --convert-to pdf --outdir . Soulknife.docx

      - name: Commit rendered book
        working-directory: characters/laynlindr-freth/backstory/book
        run: |
          git config user.name "book-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Soulknife.docx Soulknife.pdf
          git diff --cached --quiet || git commit -m "book: render docx/pdf [skip ci]"
          git push