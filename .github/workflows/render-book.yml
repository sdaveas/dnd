name: Render book

on:
  push:
    branches: [main]
    paths:
      - 'characters/laynlindr-freth/backstory/book/**'
      - '.github/workflows/render-book.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-book
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-docx
        run: pip install python-docx

      - name: Build DOCX
        working-directory: characters/laynlindr-freth/backstory/book
        run: python make_docx.py

      - name: Install LibreOffice and Garamond
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-ebgaramond

      - name: Render PDF
        working-directory: characters/laynlindr-freth/backstory/book
        run: soffice --headless --convert-to pdf --outdir . Soulknife.docx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Soulknife
          path: |
            characters/laynlindr-freth/backstory/book/Soulknife.docx
            characters/laynlindr-freth/backstory/book/Soulknife.pdf

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book
          name: Soulknife — latest
          body: Rendered automatically from main. Replaces the previous files.
          files: |
            characters/laynlindr-freth/backstory/book/Soulknife.docx
            characters/laynlindr-freth/backstory/book/Soulknife.pdf
          make_latest: true