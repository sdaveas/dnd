name: book builds

on:
  push:
    branches: [main]
    paths:
      - "characters/laynlindr-freth/backstory/book/**"
      - "labs/audiobook/tools/render_audiobook.py"
      - ".github/workflows/audiobook.yml"
  workflow_dispatch:
    inputs:
      format:
        description: "What to build"
        type: choice
        options: [all, audio, docx, pdf]
        default: all

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      FMT: ${{ inputs.format || 'audio' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-82m
      - name: Render audio
        if: env.FMT == 'audio' || env.FMT == 'all'
        run: |
          pip install kokoro-mlx
          python3 labs/audiobook/tools/render_audiobook.py --base "${{ github.event.before }}"
      - name: Build docx
        if: env.FMT == 'docx' || env.FMT == 'pdf' || env.FMT == 'all'
        run: |
          pip install python-docx
          python3 characters/laynlindr-freth/backstory/book/make_docx.py
      - name: Build pdf
        if: env.FMT == 'pdf' || env.FMT == 'all'
        run: |
          brew install --cask libreoffice
          /Applications/LibreOffice.app/Contents/MacOS/soffice --headless --convert-to pdf \
            --outdir characters/laynlindr-freth/backstory/book \
            characters/laynlindr-freth/backstory/book/Soulknife.docx
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/assets
          shopt -s nullglob
          copy() { if [ $# -ge 1 ]; then cp "$@" /tmp/assets/; fi; }
          if [ "$FMT" = "audio" ] || [ "$FMT" = "all" ]; then
            copy characters/laynlindr-freth/backstory/audiobook/*.mp3
          fi
          if [ "$FMT" = "docx" ] || [ "$FMT" = "all" ]; then
            copy characters/laynlindr-freth/backstory/book/Soulknife.docx
          fi
          if [ "$FMT" = "pdf" ] || [ "$FMT" = "all" ]; then
            copy characters/laynlindr-freth/backstory/book/Soulknife.pdf
          fi
          files=(/tmp/assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to upload"
            exit 0
          fi
          gh release view book-builds >/dev/null 2>&1 || \
            gh release create book-builds --title "Soulknife builds" --notes "Automated builds: audio (kokoro), docx, pdf."
          gh release upload book-builds "${files[@]}" --clobber
          gh release view book-builds
